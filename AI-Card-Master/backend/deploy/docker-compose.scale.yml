# Scale-ready overlay (plan §24).
# Usage from backend/:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.scale.yml \
#     up -d --build --scale api=2 --scale worker=3
#
# Nginx is the only public HTTP entry; API replicas stay on the internal network.
# Autoscale: python deploy/autoscale.py

services:
  postgres:
    # Do not expose DB to the host in scaled/prod layouts.
    ports: !reset []

  redis:
    ports: !reset []

  api:
    image: ai-card-master-backend:${IMAGE_TAG:-current}
    ports: !reset []
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
    deploy:
      resources:
        limits:
          cpus: "${AUTOSCALE_API_CPU_LIMIT:-1.0}"
          memory: ${AUTOSCALE_API_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${AUTOSCALE_API_CPU_RESERVE:-0.25}"
          memory: ${AUTOSCALE_API_MEMORY_RESERVE:-256M}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: ai-card-master-backend:${IMAGE_TAG:-current}
    environment:
      APP_ENV: ${APP_ENV:-production}
    deploy:
      resources:
        limits:
          cpus: "${AUTOSCALE_WORKER_CPU_LIMIT:-1.5}"
          memory: ${AUTOSCALE_WORKER_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${AUTOSCALE_WORKER_CPU_RESERVE:-0.5}"
          memory: ${AUTOSCALE_WORKER_MEMORY_RESERVE:-512M}

  beat:
    image: ai-card-master-backend:${IMAGE_TAG:-current}
    environment:
      APP_ENV: ${APP_ENV:-production}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.scale.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
