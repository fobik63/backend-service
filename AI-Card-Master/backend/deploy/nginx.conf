# Highload reverse proxy in front of gunicorn/uvicorn workers.
# Point Cloudflare origin to this host; keep :8000 closed from the public internet.
# For multi-replica Compose scaling use nginx.scale.conf + docker-compose.scale.yml.

upstream ai_card_api {
    least_conn;
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /health/live {
        proxy_pass http://ai_card_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://ai_card_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
