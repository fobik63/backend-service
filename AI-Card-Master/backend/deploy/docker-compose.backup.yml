# Isolated PostgreSQL backup sidecar (plan §36).
# Every 6 hours: pg_dump → AES-256 → separate S3 vault (BACKUP_S3_* ≠ app S3_*).
#
# Usage (from backend/):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.backup.yml up -d pg-backup
#
# Required in .env:
#   BACKUP_S3_ENDPOINT_URL, BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY
#   BACKUP_S3_BUCKET, BACKUP_ENCRYPTION_KEY
#   POSTGRES_PASSWORD (same as primary)

services:
  pg-backup:
    image: ai-card-master-pg-backup:current
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ai_card
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATABASE: ai_card_master
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-pg/ai_card_master}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-ru-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../deploy/postgres_backup.sh:/scripts/postgres_backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chmod +x /scripts/postgres_backup.sh
        echo "[pg-backup] sidecar started; interval=$${BACKUP_INTERVAL_SECONDS}s"
        # First backup shortly after boot (ransomware window), then every 6h.
        sleep 120
        while true; do
          if /scripts/postgres_backup.sh; then
            echo "[pg-backup] cycle ok $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            echo "[pg-backup] cycle FAILED $$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2
            if [ -n "$${TELEGRAM_ERROR_BOT_TOKEN:-}" ] && [ -n "$${TELEGRAM_ERROR_CHAT_ID:-}" ]; then
              curl -fsS -X POST \
                "https://api.telegram.org/bot$${TELEGRAM_ERROR_BOT_TOKEN}/sendMessage" \
                -d "chat_id=$${TELEGRAM_ERROR_CHAT_ID}" \
                --data-urlencode "text=🚨 PG backup FAILED" >/dev/null || true
            fi
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
