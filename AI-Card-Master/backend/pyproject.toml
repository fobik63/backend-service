[project]
name = "ai-card-master-backend"
version = "0.1.0"
requires-python = ">=3.11"
description = "AI-Card-Master FastAPI backend"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "alembic/versions",
  "artifacts",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "ASYNC",
]
ignore = [
  # FastAPI intentionally evaluates Depends/Query/Body in function defaults.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  # Test doubles and fixtures intentionally use broad/untyped signatures.
  "B017",
  "B018",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
exclude = [
  "alembic/versions/",
  "artifacts/",
  "tests/",
]

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "fakeredis.*",
  "moderngl.*",
  "pyvista.*",
  "rembg.*",
  "slowapi.*",
]
ignore_missing_imports = true
